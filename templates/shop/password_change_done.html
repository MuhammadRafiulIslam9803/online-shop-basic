{% extends "shop/base.html" %}

{% block title %}Password Changed - Shop Online BD{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 text-center">

        <!-- Success Icon -->
        <div class="flex justify-center mb-5">

            <div
                class="w-16 h-16 rounded-full bg-green-100
                       flex items-center justify-center">

                <i class="fa-solid fa-check text-3xl text-green-600"></i>

            </div>

        </div>


        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-3">
            Password Changed Successfully
        </h2>


        <!-- Message -->
        <p class="text-gray-500 leading-relaxed mb-7">
            Your password has been changed successfully.
            You can now continue shopping securely.
        </p>


        <!-- Home Button -->
        <a href="{% url 'home' %}"
            class="inline-flex items-center justify-center gap-2
                   w-full bg-indigo-600 text-white py-3 rounded-lg
                   font-semibold hover:bg-indigo-700 transition">

            <i class="fa-solid fa-house"></i>
            Back to Home

        </a>


        <!-- Profile -->
        <a href="#"
            class="inline-flex items-center justify-center gap-2
                   mt-3 text-sm text-gray-500
                   hover:text-indigo-600">

            <i class="fa-regular fa-user"></i>
            Go to Profile

        </a>

    </div>

</div>

{% endblock %}
