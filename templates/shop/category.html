{% extends "shop/base.html" %}

{% block title %}{{ category|title }} - Shop Online BD{% endblock %}

{% block content %}
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">
            {{ category|title }}
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for product in products %}
                <div class="bg-white shadow-md rounded-lg overflow-hidden">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h2 class="text-xl font-bold text-gray-800">{{ product.name }}</h2>
                        <p class="text-lg font-semibold text-indigo-600">৳{{ product.price }}</p>
                        <a href="{% url 'productDetails' product.id %}" class="mt-4 inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                            View Details
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
